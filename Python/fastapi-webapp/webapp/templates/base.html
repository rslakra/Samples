<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FastAPI Webapp{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/">FastAPI Webapp</a>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="{% if page == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="/dashboard" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/features" class="{% if page == 'features' %}active{% endif %}">Features</a></li>
                <li><a href="/about" class="{% if page == 'about' %}active{% endif %}">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FastAPI Webapp. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
