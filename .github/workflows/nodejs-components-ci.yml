name: Node.js - Components CI

on:
  push:
    paths:
      - "Node.js/nodejs-components/**"
      - ".github/workflows/nodejs-components-ci.yml"
  pull_request:
    paths:
      - "Node.js/nodejs-components/**"
      - ".github/workflows/nodejs-components-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Node.js/nodejs-components

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # No dependencies and no build step: the project only uses Node.js built-in modules.
      - name: Check the Node.js version
        run: make check

      # Runs every demo (math, os/path, fs callbacks, fs.promises, streams) and fails if any of them
      # exits with an error. stdout is discarded because the demos print a lot; errors still show.
      - name: Run all demos
        run: make all > /dev/null
