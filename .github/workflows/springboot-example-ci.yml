name: SpringBoot - SpringbootExample CI

on:
  push:
    paths:
      - "SpringBoot/springboot-example/**"
      - ".github/workflows/springboot-example-ci.yml"
  pull_request:
    paths:
      - "SpringBoot/springboot-example/**"
      - ".github/workflows/springboot-example-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: SpringBoot/springboot-example

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: SpringBoot/springboot-example/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
