name: Spring - spring-xml CI

on:
  push:
    paths:
      - "Spring/spring-xml/**"
      - ".github/workflows/spring-xml-ci.yml"
  pull_request:
    paths:
      - "Spring/spring-xml/**"
      - ".github/workflows/spring-xml-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Spring/spring-xml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Spring/spring-xml/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
