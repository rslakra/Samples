name: k8s-demo-app CI

# Builds the k8s-demo-app image on every pull request, and on a push to master also pushes it to
# GitHub Container Registry and updates the image tag in the ArgoCD config repo, so ArgoCD deploys it.
#
# Required secret: INFRA_REPO_TOKEN - a token that can push to rslakra/Infrastructure
# (a fine-grained PAT with "Contents: read and write" on that repository).

env:
  IMAGE_NAME: ghcr.io/rslakra/k8s-demo-app
  APP_DIR: Node.js/k8s-demo-app
  CONFIG_REPO: rslakra/Infrastructure
  CONFIG_BRANCH: master
  CONFIG_FILE: ArgoCD/argocd-app-config/dev/deployment.yaml

on:
  pull_request:
    paths:
      - "Node.js/k8s-demo-app/**"
      - ".github/workflows/k8s-demo-app-ci.yml"
  push:
    branches: [master]
    paths:
      - "Node.js/k8s-demo-app/**"
      - ".github/workflows/k8s-demo-app-ci.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pull requests only build the image (to catch a broken Dockerfile); they never push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifest:
    name: Update image tag in the ArgoCD config
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CONFIG_REPO }}
          ref: ${{ env.CONFIG_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Point the deployment at the new image
        run: sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" "${CONFIG_FILE}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Image tag is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "k8s-demo-app: deploy ${GITHUB_SHA::7}"
          git push origin "HEAD:${CONFIG_BRANCH}"
