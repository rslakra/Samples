name: Samples - Spring Modules CI

env:
  SPRING_ROOT: Spring
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    paths:
      - "Spring/**"
      - ".github/workflows/samples-spring-ci.yml"
  pull_request:
    paths:
      - "Spring/**"
      - ".github/workflows/samples-spring-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [spring-annotation, spring-core, spring-java, spring-xml]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.SPRING_ROOT }}/${{ matrix.module }}/pom.xml

      - name: Build and run unit tests
        working-directory: ${{ env.SPRING_ROOT }}/${{ matrix.module }}
        run: mvn -B -ntp test
