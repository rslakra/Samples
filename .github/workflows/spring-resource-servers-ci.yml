name: SpringBoot - SpringResourceServers CI

on:
  push:
    paths:
      - "SpringBoot/spring-resource-servers/**"
      - ".github/workflows/spring-resource-servers-ci.yml"
  pull_request:
    paths:
      - "SpringBoot/spring-resource-servers/**"
      - ".github/workflows/spring-resource-servers-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [springboot-resource-server, springboot-resource-server-access]
    defaults:
      run:
        working-directory: SpringBoot/spring-resource-servers/${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: SpringBoot/spring-resource-servers/${{ matrix.module }}/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
