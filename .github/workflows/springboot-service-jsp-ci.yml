name: SpringBoot - SpringbootServiceJsp CI

on:
  push:
    paths:
      - "SpringBoot/springboot-service-jsp/**"
      - ".github/workflows/springboot-service-jsp-ci.yml"
  pull_request:
    paths:
      - "SpringBoot/springboot-service-jsp/**"
      - ".github/workflows/springboot-service-jsp-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: SpringBoot/springboot-service-jsp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: SpringBoot/springboot-service-jsp/pom.xml

      - name: Build and run unit tests
        run: mvn -B -ntp test
